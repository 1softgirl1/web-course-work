# Optional local demo: use together with docker-compose.yml (see README.md).
services:
  backup:
    image: registry-backup:local
    build:
      context: ./deploy/backup
    init: true
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: web_course_work
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT in .backup-local/backup.env as described in README.md}
      UI_USER: admin
      UI_PASSWORD: local-backup-password
      BACKEND_HEALTH_URL: http://backend:8081/actuator/health
      NFS_ENABLED: "false"
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      NOTIFIER_URL: ""
      NOTIFIER_TOKEN: ""
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - backups:/backups
      - ./docker-compose.yml:/config/docker-compose.yml:ro
      - ./docker-compose.backup.yml:/config/docker-compose.backup.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backups:
