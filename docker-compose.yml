services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: web_course_work
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_course_work"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/web_course_work
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET:-web-course-work-super-secret-jwt-key-please-change}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-PT720H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    expose:
      - "8080"
    depends_on:
      front-builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin-password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /db/admin
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  front-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /
    environment:
      VITE_API_BASE_URL: ""
      VITE_BASE_PATH: /
    volumes:
      - web-data:/app/dist
    command: ["npm", "run", "build"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - web-data:/usr/share/nginx/html:ro
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      front-builder:
        condition: service_completed_successfully
      pgadmin:
        condition: service_started

volumes:
  postgres-data:
  pgadmin-data:
  web-data:
