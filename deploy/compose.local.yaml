services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}

  pgadmin:
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PREFIX_NAME}-local-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - web-data:/usr/share/nginx/html:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
      - nginx-external
    depends_on:
      backend:
        condition: service_started
      front-builder:
        condition: service_completed_successfully
      pgadmin:
        condition: service_started
    restart: unless-stopped

networks:
  nginx-external:
    name: ${COMMON_NAME}_${PREFIX_NAME}-local-nginx-network
    external: false

volumes:
  web-data:
    name: ${COMMON_NAME}_${PREFIX_NAME}-local-web-data
    external: false
