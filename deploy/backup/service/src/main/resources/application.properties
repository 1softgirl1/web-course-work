spring.application.name=backup-service
server.port=${PORT:8090}
spring.jackson.default-property-inclusion=non_null

# Single operator account for the UI (behind an SSH tunnel; the port is bound to 127.0.0.1 only).
app.ui.user=${UI_USER:admin}
app.ui.password=${UI_PASSWORD}

# Where backups, status.json, settings.json and journal.jsonl live (the backups volume).
app.data-dir=${BACKUP_DIR:/backups}
app.backup-command=${BACKUP_COMMAND:backup}
app.verify-command=${VERIFY_COMMAND:verify}
app.restore-command=${RESTORE_COMMAND:restore}
app.cloud-command=${CLOUD_COMMAND:cloud}
# Deadlines include live output draining, stdin and child processes; hard-NFS kernel waits remain best-effort.
app.operation-timeout-seconds=${OPERATION_TIMEOUT_SECONDS:7200}
app.psql-timeout-seconds=${PSQL_TIMEOUT_SECONDS:60}
app.network.enabled=${NFS_ENABLED:false}
app.network.command=${NETWORK_STORAGE_COMMAND:network-storage}
# Live registry database (the one the site uses); restore never writes into it.
app.live-database=${PGDATABASE:}
# Weekly re-check of stored copies (hash level of "0 errors").
app.verify-cron=${VERIFY_CRON:0 30 4 * * SUN}

# Health checks every minute; results go to the UI and, as a heartbeat, to the notifier.
app.health.backend-url=${BACKEND_HEALTH_URL:http://registry-backend:8081/actuator/health}
app.health.backup-max-age-hours=${BACKUP_MAX_AGE_HOURS:26}
app.health.verify-max-age-hours=${VERIFY_MAX_AGE_HOURS:192}
app.notifier.url=${NOTIFIER_URL:}
app.notifier.token=${NOTIFIER_TOKEN:}
app.notifier.source=${NOTIFIER_SOURCE:registry}

# The UI is rebuilt into the image: browsers must revalidate, or an update shows the old page (304 keeps it cheap).
spring.web.resources.cache.cachecontrol.no-cache=true
