services:
  backend:
    container_name: registry-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE:-prod}
      JWT_SECRET: ${JWT_SECRET:-web-course-work-super-secret-jwt-key-please-change}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-PT720H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    networks:
      - app-network
      - nginx-external
    expose:
      - '8080'
    depends_on:
      front-builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: registry-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      # nginx-external — чтобы центральный nginx (stream) дотягивался до БД по имени
      - app-network
      - nginx-external
    expose:
      - '5432'
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Backup service: nightly encrypted backups (DB + configs) with a restore check, local rotation and an
  # object-locked S3 copy and a separate NFS copy; health checks with a heartbeat to the notifier; operator UI.
  # UI: only on 127.0.0.1:8090 of the server - open through an SSH tunnel (port forwarding).
  backup:
    container_name: registry-backup
    # tini as PID 1 reaps the short-lived processes the scripts start (pg_ctl, aws, ...).
    init: true
    build:
      context: ./deploy/backup
    environment:
      TZ: ${BACKUP_TZ:-Asia/Novokuznetsk}
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      UI_USER: ${BACKUP_UI_USER:-admin}
      UI_PASSWORD: ${BACKUP_UI_PASSWORD}
      NOTIFIER_URL: ${BACKUP_NOTIFIER_URL:-}
      NOTIFIER_TOKEN: ${BACKUP_NOTIFIER_TOKEN:-}
      BACKEND_HEALTH_URL: http://registry-backend:8081/actuator/health
      NFS_ENABLED: ${BACKUP_NFS_ENABLED:-true}
    networks:
      - app-network
    ports:
      - '127.0.0.1:${BACKUP_UI_PORT:-8090}:8090'
    volumes:
      - type: volume
        source: backups
        target: /backups
      # Mount the existing NFS root, not a subdirectory that Docker could create on the local disk.
      # network-storage additionally checks the filesystem type before any remote operation.
      - type: bind
        source: ${BACKUP_NFS_PATH:-/opt1}
        target: /backup-storage
        bind:
          create_host_path: false
      # Configs that are not in git (or edited on the server) go into every backup, read-only.
      - ./compose.yaml:/config/compose.yaml:ro
      - ./prod:/config/prod:ro
      - ./internal:/config/internal:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
