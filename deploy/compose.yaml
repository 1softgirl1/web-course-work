services:
  backend:
    container_name: kpsz-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-web-course-work-super-secret-jwt-key-please-change}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-PT720H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    networks:
      - app-network
      - nginx-external
    expose:
      - '8080'
    depends_on:
      front-builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: kpsz-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network
    expose:
      - '5432'
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d web_course_work" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: kpsz-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: False
      SCRIPT_NAME: /db/admin
    networks:
      - app-network
      - nginx-external
    expose:
      - '80'
    volumes:
      - type: volume
        source: pgadmin-data
        target: /var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  front-builder:
    container_name: kpsz-frontend-builder
    environment:
      VITE_BASE_PATH: /
      VITE_API_BASE_URL: https://test.duvanoff.su
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    volumes:
      - type: volume
        source: web-data
        target: /app/dist
    command: [ 'npm', 'run', 'build' ]



networks:
  app-network:
  nginx-external:
    external: true
    name: ${COMMON_NAME}_nginx-network

volumes:
  postgres-data:
    name: ${COMMON_NAME}_kpsz-postgres-data
  pgadmin-data:
    name: ${COMMON_NAME}_kpsz-pgadmin-data
  web-data:
    external: true
    name: ${COMMON_NAME}_web-data
