  front-builder:
    container_name: registry-frontend-builder
    environment:
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://test.duvanoff.su}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
    volumes:
      - type: volume
        source: web-data
        target: /app/web-data
    command: [ 'sh', '-c', 'npm run build && rm -rf /app/web-data/registry && cp -r /app/dist/. /app/web-data/registry' ]

networks:
  app-network:
  nginx-external:
    external: true
    name: ${COMMON_NAME}_nginx-network

volumes:
  postgres-data:
    name: ${COMMON_NAME}_registry-postgres-data
  pgadmin-data:
    name: ${COMMON_NAME}_registry-pgadmin-data
  web-data:
    external: true
    name: ${COMMON_NAME}_web-data