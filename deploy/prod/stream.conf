# PostgreSQL registry — TCP-проброс наружу через центральный nginx (stream).
# Копируется скриптом manage.sh в nginx/stream/registry.conf и включается
# обёрткой stream{} главного nginx.conf. resolver объявлен в этой обёртке;
# переменная откладывает резолв registry-postgres до момента подключения.
server {
    listen 5432;
    set $registry_pg registry-postgres:5432;
    proxy_pass $registry_pg;
}
