server {
    listen 80;
    listen [::]:80;

    charset utf-8;

    # Frontend (SPA под подпутём /kpsz)
    # alias стрипует /kpsz/ из URI перед склейкой с путём,
    # поэтому try_files /kpsz/index.html → /var/www/html/index.html без петли
    location = /registry {
        return 301 /registry/;
    }

    location /registry/ {
        root /var/www/html/;
        try_files $uri $uri/ /registry/index.html;
    }

    # Swagger UI
    location /registry/swagger-ui {
        proxy_pass http://registry-backend:8080/swagger-ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # OpenAPI spec (с префиксом — для прямых вызовов)
    location /registry/v3/api-docs {
        proxy_pass http://registry-backend:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # OpenAPI spec (без префикса — springdoc жёстко прописывает /v3/api-docs в swagger-initializer.js)
    location /v3/api-docs {
        proxy_pass http://registry-backend:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Backend API (strip /registry prefix)
    location /registry/api/ {
        proxy_pass http://registry-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
