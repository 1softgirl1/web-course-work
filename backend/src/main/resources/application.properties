spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/web_course_work}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=${JWT_SECRET:web-course-work-super-secret-jwt-key-please-change}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:PT720H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
