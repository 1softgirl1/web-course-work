spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/web_course_work}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=${JWT_SECRET:web-course-work-super-secret-jwt-key-please-change}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:PT720H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Telemetry: request id in every log line, async writer with a bounded queue, retention job.
logging.pattern.level=%5p [%X{requestId:-}]
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=10000
app.telemetry.slow-request-ms=${TELEMETRY_SLOW_REQUEST_MS:1000}
app.telemetry.retention-days=${TELEMETRY_RETENTION_DAYS:365}
app.telemetry.cleanup-cron=${TELEMETRY_CLEANUP_CRON:0 30 3 * * *}

# Actuator lives on a separate port that is neither published in compose nor proxied by nginx.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics
management.info.build.enabled=true
